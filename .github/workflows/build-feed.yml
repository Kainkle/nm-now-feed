name: build-feed

on:
  schedule:
    # v3.3 (2026-08-30): 4 slots/hour, not 2. GitHub's cron is best-effort and tonight
    # it DROPPED four consecutive slots (02:37–04:07, workflow state "active", zero
    # runs created) — a 2-slot cadence has no redundancy against drops. The freshness
    # guard below makes dense slots no-op cheap when the feed is young, so the extra
    # slots cost nothing in steady state; the first slot to fire after any gap builds.
    - cron: "7,21,37,51 * * * *"
  repository_dispatch:
    # v3.5: the trigger of record. An external cron service (the user's choice after
    # GitHub's scheduler dropped 8 consecutive slots on 2026-08-30 with every status
    # page green) POSTs /repos/Kainkle/nm-now-feed/dispatches every 20 min with
    # event_type "feed-tick". The freshness guard below makes ticks no-op cheap when
    # the feed is young — the tick only needs to ARRIVE, not to be smart.
    types: [feed-tick]
  workflow_dispatch:
    inputs:
      force:
        # true = skip the freshness guard and build NOW (a manual ask). The local
        # 20-min trigger task dispatches without force, so it no-ops when fresh.
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  # A late run must not stack on a running one and produce conflicting commits.
  group: build-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Freshness guard
        # ANY trigger skips the build when the published feed is young (<25 min) —
        # GitHub's cron drops whole slots silently (measured 2026-08-30: eight in a
        # row, state "active", status page green), so the real trigger is a local
        # 20-min dispatch task, and the guard is what keeps triggers from stacking.
        # force=true (manual ask) is the only path past it.
        id: guard
        env:
          FORCE: ${{ inputs.force }}
        run: |
          if [ "$FORCE" = "true" ]; then
            echo "forced — building"; echo "fresh=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          AGE=$(python - <<'EOF'
          import datetime, json, urllib.request
          try:
              d = json.load(urllib.request.urlopen(
                  "https://raw.githubusercontent.com/Kainkle/nm-now-feed/main/feed/lineup.json",
                  timeout=30))
              gen = datetime.datetime.strptime(d["meta"]["generated_utc"], "%Y-%m-%dT%H:%M:%SZ"
                  ).replace(tzinfo=datetime.timezone.utc)
              print(int((datetime.datetime.now(datetime.timezone.utc) - gen).total_seconds() // 60))
          except Exception:
              print(999)  # unreadable feed = build, never skip on a guess
          EOF
          )
          echo "published feed age: ${AGE}m"
          echo "age_min=$AGE" >> "$GITHUB_OUTPUT"
          if [ "$AGE" -lt 25 ]; then
            echo "feed is fresh — skipping this slot"
            echo "fresh=true" >> "$GITHUB_OUTPUT"
          else
            echo "fresh=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build feed
        if: steps.guard.outputs.fresh != 'true'
        # Hard failures abort the job and leave the previous feed published. Per-channel
        # stream failures degrade that channel only and heal on the next 30-min rebuild.
        # The NTV catalog fetch can take ~2 min cold — their server cache, not us.
        # v3.1: Phoenix is IP-BOUND — a runner mint 403s on every box — so CI carries
        # the previous feed's phoenix URLs untouched and mints nothing; only Titan
        # (IP-agnostic) + 9 EPG files are re-resolved here. Phoenix re-mints happen on
        # the home network's builds. Cold run ~10-15 min.
        # v3.2: PYTHONUNBUFFERED — the 2026-08-28..29 stalls were 45 minutes of SILENCE
        # inside one blocked read; buffered stdout meant even the prints that DID run
        # never reached the log. Unbuffered, a stall names its own last line.
        env:
          PYTHONUNBUFFERED: "1"
        run: python -m nmnowfeed.build --out feed
      - name: Commit if changed
        if: steps.guard.outputs.fresh != 'true'
        run: |
          git config user.name "nm-now-feed bot"
          git config user.email "actions@github.com"
          # Never commit an empty feed over a working one.
          COUNT=$(python -c "import json;print(len(json.load(open('feed/lineup.json'))['channels']))")
          PROGS=$(python -c "import json;print(sum(len(c['programmes']) for c in json.load(open('feed/lineup.json'))['channels']))")
          echo "channels: $COUNT  programmes: $PROGS"
          if [ "$COUNT" -eq 0 ]; then echo "empty feed - refusing to commit"; exit 0; fi
          git add feed/
          git diff --staged --quiet || git commit -m "feed: $COUNT channels, $PROGS programmes [skip ci]"
          # A push can lose a race with a manual push landing mid-build (measured
          # 2026-08-30: run 33292177983 failed its whole job on exactly this). Rebase
          # the feed commit onto whatever won and retry once — the feed blob cannot
          # conflict with anything but itself.
          git push || (git pull --rebase && git push)
